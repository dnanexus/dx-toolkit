name: Validate Nextflow asset JSON files

on:
  pull_request:
    paths:
      - "src/python/dxpy/nextflow/**"
  push:
    branches:
      - master
    paths:
      - "src/python/dxpy/nextflow/**"

jobs:
  validate-assets:
    name: Validate asset record/project IDs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.x"

      - name: Run Nextflow asset validator
        run: python src/python/dxpy/nextflow/validate_nextflow_assets.py

